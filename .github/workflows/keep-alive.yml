name: keep-alive

# Supabase's free tier pauses a project after about seven days without a query, and GitHub starts a
# schedule hours late or skips it under load, so a weekly ping can leave a gap longer than that.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health route
        env:
          HOKKA_URL: ${{ secrets.HOKKA_URL }}
        run: |
          if [ -z "${HOKKA_URL}" ]; then
            echo "::error::The HOKKA_URL repository secret is not set. Set it to the deployed origin, such as https://hokka.example.com"
            exit 1
          fi
          curl --fail --silent --show-error \
            --max-time 30 --retry 4 --retry-delay 20 --retry-all-errors \
            "${HOKKA_URL%/}/api/health"

      # GitHub turns off a public repo's schedules after 60 days without activity. Re-enabling the
      # workflow through the API resets that clock, so the schedule keeps itself on.
      - name: Keep the schedule enabled
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
