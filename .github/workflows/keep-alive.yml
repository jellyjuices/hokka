name: keep-alive

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health route
        env:
          HOKKA_URL: ${{ secrets.HOKKA_URL }}
        run: |
          curl --fail --silent --show-error "${HOKKA_URL}/api/health"
